<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Qué personaje Disney eres? ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lora:ital,wght@0,700;1,600&display=swap');

:root {
  --bg:      #FEF9F2;
  --paper:   #FFFFFF;
  --warm1:   #FDF0DC;
  --warm2:   #F7E2BB;
  --border:  #ECD9BE;
  --text:    #3A2E22;
  --muted:   #9C8870;
  --accent:  #E07A3A;
  --sky:     #5B9EC9;
  --green:   #6BAA75;
  --rose:    #D4607A;
  --r1:      #F5A623;
  --r2:      #A8B8C8;
  --r3:      #C49A6C;
  --radius:  18px;
  --shadow:  0 4px 24px rgba(58,46,34,.09);
  --shadow-s:0 2px 10px rgba(58,46,34,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Nunito',system-ui,sans-serif;color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:1.5rem 1rem 5rem}
.wrap{width:100%;max-width:640px}

.screen{display:none}
.screen.active{display:block;animation:popIn .4s cubic-bezier(.34,1.4,.64,1) both}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}

.intro-art{text-align:center;font-size:5rem;line-height:1;margin-bottom:.6rem}
.intro-title{font-family:'Lora',serif;font-size:clamp(2.4rem,8vw,3.5rem);font-weight:700;line-height:1.1;text-align:center;margin-bottom:.35rem}
.intro-title em{font-style:italic;color:var(--accent)}
.intro-sub{text-align:center;color:var(--muted);font-size:.95rem;font-weight:700;margin-bottom:2rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2rem}
.chip{background:var(--warm1);border:1.5px solid var(--border);border-radius:99px;padding:.4rem 1rem;font-size:.83rem;font-weight:700;color:var(--muted)}
.btn-start{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:1.1rem;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(224,122,58,.35);transition:background .15s,transform .1s}
.btn-start:hover{background:#c86828;transform:translateY(-2px)}

.prog-wrap{margin-bottom:1.2rem}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.45rem}
.prog-label{font-size:.8rem;font-weight:700;color:var(--muted)}
.prog-frac{font-size:.8rem;font-weight:800;color:var(--accent)}
.prog-track{height:8px;background:var(--warm2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#f0a060);border-radius:99px;transition:width .5s ease}
.prog-dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:.5rem}
.prog-star{font-size:.68rem;line-height:1;opacity:.25;transition:opacity .3s,transform .3s;display:inline-block;transform:scale(.9)}
.prog-star.done{opacity:1;transform:scale(1)}
.prog-star.cur{opacity:.6;transform:scale(1.1)}

.q-card{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.6rem 1.5rem 1.3rem;box-shadow:var(--shadow);margin-bottom:.9rem}
.q-tag-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.q-tag{background:var(--warm1);border:1px solid var(--border);border-radius:99px;padding:.22rem .8rem;font-size:.7rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.q-text{font-family:'Lora',serif;font-size:1.18rem;font-weight:700;line-height:1.5;color:var(--text);margin-bottom:1.1rem}
.opts{display:grid;gap:.55rem}
.opt{background:var(--bg);border:2px solid var(--border);border-radius:13px;padding:.8rem 1rem;text-align:left;font-family:'Nunito',sans-serif;font-size:.92rem;font-weight:600;color:var(--text);cursor:pointer;transition:border-color .14s,background .14s,transform .1s;display:flex;align-items:center;gap:.7rem;line-height:1.4}
.opt:hover{border-color:var(--accent);background:var(--warm1);transform:translateX(3px)}
.opt.sp{border-color:var(--accent);background:var(--accent);color:#fff}
.opt-letter{flex-shrink:0;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--border);color:var(--muted);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;transition:background .14s,color .14s}
.opt.sp .opt-letter{background:rgba(255,255,255,.3);color:#fff}

.nav-row{display:flex;gap:.6rem}
.btn-nav{flex:1;background:transparent;border:2px solid var(--border);border-radius:13px;padding:.75rem;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:700;color:var(--muted);cursor:pointer;transition:border-color .14s,color .14s}
.btn-nav:hover:not(:disabled){border-color:var(--muted);color:var(--text)}
.btn-nav.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(224,122,58,.3)}
.btn-nav.primary:hover:not(:disabled){background:#c86828}
.btn-nav:disabled{opacity:.3;cursor:default}

#screen-loading{display:none;text-align:center;padding:5rem 1rem}
.loading-dog{font-size:4rem}
.loading-title{font-family:'Lora',serif;font-size:1.5rem;font-weight:700;margin:1rem 0 .35rem}
.loading-sub{color:var(--muted);font-size:.9rem;font-weight:600;margin-bottom:1.5rem}
.loading-breeds{color:var(--accent);font-size:.8rem;font-weight:700;margin-bottom:1.2rem;min-height:1.2em;transition:opacity .3s}
.dots{display:flex;gap:.4rem;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:bounce .8s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s;background:var(--sky)}
.dot:nth-child(3){animation-delay:.3s;background:var(--green)}
@keyframes bounce{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-10px);opacity:1}}

.share-card{background:linear-gradient(145deg,#FFF8EE,#FEF0D8);border:2px solid var(--warm2);border-radius:22px;padding:2rem 1.5rem 1.6rem;text-align:center;box-shadow:var(--shadow);margin-bottom:1.2rem;position:relative;overflow:hidden}
.share-card::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(224,122,58,.12),transparent 70%);pointer-events:none}
.result-emoji{font-size:5rem;line-height:1;display:block;margin-bottom:.5rem}
.result-icon{width:120px;height:120px;object-fit:contain;display:block;margin:0 auto .5rem}
.result-eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted);margin-bottom:.25rem}
.result-name{font-family:'Lora',serif;font-size:2.4rem;font-weight:700;line-height:1.1;margin-bottom:.2rem}
.result-tagline{font-family:'Lora',serif;font-style:italic;font-size:1rem;color:var(--accent);margin-bottom:.9rem}
.match-badge{display:inline-flex;align-items:center;gap:.4rem;background:var(--accent);color:#fff;border-radius:99px;padding:.38rem 1.1rem;font-size:.88rem;font-weight:800;margin-bottom:.7rem;box-shadow:0 3px 10px rgba(224,122,58,.3)}
.margin-note{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:1rem;font-style:italic}
.margin-note.clear{color:var(--green)}
.margin-note.tied{color:var(--sky)}
.traits-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:.5rem}
.trait-pill{background:var(--warm1);border:1.5px solid var(--border);border-radius:99px;padding:.25rem .85rem;font-size:.8rem;font-weight:700;color:var(--muted)}
.btn-copy{display:block;width:100%;margin-top:1rem;background:transparent;border:2px solid var(--border);border-radius:12px;padding:.65rem;font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:700;color:var(--muted);cursor:pointer;transition:border-color .14s,color .14s}
.btn-copy:hover{border-color:var(--accent);color:var(--accent)}
.btn-download{margin-top:.6rem}

.section{margin-bottom:1.2rem}
.section-head{font-family:'Lora',serif;font-size:1.05rem;font-weight:700;margin-bottom:.7rem;display:flex;align-items:center;gap:.45rem}
.desc-box{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.2rem;font-size:.94rem;line-height:1.75;box-shadow:var(--shadow-s)}

.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
.pc{background:var(--paper);border:1.5px solid var(--border);border-radius:14px;padding:.9rem .6rem;text-align:center;box-shadow:var(--shadow-s);position:relative}
.pc.r1{border-color:var(--r1);background:linear-gradient(160deg,#FFF8EE,#FFF3D8)}
.pc.r2{border-color:var(--r2)}
.pc.r3{border-color:var(--r3)}
.pc-medal{font-size:1.2rem;display:block;margin-bottom:.15rem}
.pc-emoji{font-size:1.8rem;line-height:1;margin-bottom:.15rem}
.pc-icon{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto .15rem}
.r1 .pc-icon{width:76px;height:76px}
.pc-name{font-size:.75rem;font-weight:800;margin-bottom:.15rem}
.pc-pct{font-size:.82rem;font-weight:800;color:var(--muted)}
.pc.r1 .pc-pct{color:var(--r1)}
.pc-gap{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:.1rem}

.bars-box{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--radius);padding:1.2rem;box-shadow:var(--shadow-s)}
.bar-row{display:flex;align-items:center;gap:.7rem;margin-bottom:.6rem}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{font-size:.76rem;font-weight:700;width:130px;flex-shrink:0;color:var(--muted)}
.bar-track{flex:1;height:8px;background:var(--warm2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;width:0%;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bar-val{font-size:.7rem;font-weight:700;width:30px;text-align:right;color:var(--muted)}

.compat-row{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.cc{border-radius:14px;padding:1rem;border:1.5px solid}
.cc.good{background:rgba(107,170,117,.1);border-color:rgba(107,170,117,.4)}
.cc.clash{background:rgba(212,96,122,.1);border-color:rgba(212,96,122,.35)}
.cc-lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.35rem}
.cc.good .cc-lbl{color:var(--green)}
.cc.clash .cc-lbl{color:var(--rose)}
.cc-breed{font-size:.9rem;font-weight:800;margin-bottom:.25rem}
.cc-why{font-size:.78rem;color:var(--muted);line-height:1.45;font-weight:600}

.btn-restart{display:block;width:100%;background:transparent;border:2px solid var(--border);border-radius:var(--radius);padding:1rem;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:800;color:var(--muted);cursor:pointer;transition:all .15s;margin-top:.5rem}
.btn-restart:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:420px){.compat-row{grid-template-columns:1fr}.podium{gap:.4rem}.pc{padding:.7rem .4rem}.bar-lbl{width:105px;font-size:.7rem}}
</style>
</head>
<body><div class="wrap">

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="intro-art">✨</div>
  <h1 class="intro-title">¿Qué personaje<br><em>Disney eres?</em></h1>
  <div class="chips">
    <span class="chip">🎬 40 preguntas</span>
    <span class="chip">👑 40 personajes</span>
    <span class="chip">🏆 Podio preciso</span>
    <span class="chip">📊 9 dimensiones</span>
    <span class="chip">💛 Compatibilidades</span>
  </div>
  <button class="btn-start" onclick="startQuiz()">¡Empezar el test! ✨</button>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="prog-wrap">
    <div class="prog-top">
      <span class="prog-label" id="prog-label">Pregunta 1 de 40</span>
      <span class="prog-frac" id="prog-frac">0 / 40</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-dots" id="prog-dots"></div>
  </div>
  <div class="q-card" id="q-card">
    <div class="q-tag-row">
      <span class="q-tag" id="q-tag">Rutina</span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div class="opts" id="opts"></div>
  </div>
  <div class="nav-row">
    <button class="btn-nav" id="btn-prev" onclick="goBack()">← Anterior</button>
    <button class="btn-nav primary" id="btn-next" onclick="goNext()" disabled>Siguiente →</button>
  </div>
</div>

<!-- LOADING -->
<div id="screen-loading">
  <div class="loading-dog">🎬</div>
  <div class="loading-title">Comparando con 40 personajes…</div>
  <div class="loading-sub">Calculando tu perfil de personalidad</div>
  <div class="loading-breeds" id="loading-breeds">Analizando…</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div id="result-content"></div>
</div>

</div>

<script>
// ══════════════════════════════════════════════════════
// 9 DIMENSIONES
// ══════════════════════════════════════════════════════
const DIMS = ['ambicion','sociabilidad','lealtad','independencia','idealismo','espontaneidad','sarcasmo','orgullo','sensibilidad'];
const DIM_META = {
  ambicion:       {label:'🎯 Ambición',            color:'#E07A3A'},
  sociabilidad:   {label:'🤝 Sociabilidad',        color:'#5B9EC9'},
  lealtad:        {label:'💛 Lealtad',             color:'#D4607A'},
  independencia:  {label:'🦅 Independencia',       color:'#8B6DB5'},
  idealismo:      {label:'✨ Idealismo',           color:'#6BAA75'},
  espontaneidad:  {label:'⚡ Espontaneidad',       color:'#F5A623'},
  sarcasmo:       {label:'😏 Sarcasmo',            color:'#C49A6C'},
  orgullo:        {label:'👑 Orgullo',             color:'#A8B8C8'},
  sensibilidad:   {label:'💧 Sensibilidad',        color:'#9C8870'},
};

// ══════════════════════════════════════════════════════
// 40 PREGUNTAS
// ══════════════════════════════════════════════════════
const Qs = [
{tag:'Rutina', text:'¿Cómo prefieres empezar el día?',
 opts:[
  {t:'Con un plan claro de lo que quiero lograr', s:{ambicion:3,independencia:1}},
  {t:'Sin horarios fijos, según me apetezca', s:{espontaneidad:3,independencia:1}},
  {t:'Con calma, disfrutando el momento', s:{idealismo:2,sensibilidad:2}},
  {t:'Rodeado/a de gente desde temprano', s:{sociabilidad:3}},
]},
{tag:'Rutina', text:'Un domingo libre sin ninguna obligación, ¿qué haces?',
 opts:[
  {t:'Aprovecho para adelantar algo de mis metas', s:{ambicion:2,orgullo:1}},
  {t:'Quedo con la gente que más quiero', s:{lealtad:2,sociabilidad:2}},
  {t:'Salgo a hacer algo que no había planeado', s:{espontaneidad:3}},
  {t:'Me quedo solo/a, recargando energía', s:{independencia:3}},
]},
{tag:'Social', text:'Llegas a una fiesta donde no conoces a nadie.',
 opts:[
  {t:'Me presento a todo el mundo enseguida', s:{sociabilidad:3,espontaneidad:1}},
  {t:'Busco un rincón tranquilo y observo antes de acercarme', s:{independencia:2,sensibilidad:1}},
  {t:'Me quedo cerca de quien ya conozco', s:{lealtad:2}},
  {t:'Busco a la persona más interesante de la sala', s:{ambicion:1,orgullo:2}},
]},
{tag:'Social', text:'Estás en una cena familiar con tensión en el ambiente.',
 opts:[
  {t:'Intento que todos se lleven bien, aunque me cueste', s:{idealismo:2,sociabilidad:1}},
  {t:'Rompo el hielo con una broma', s:{sarcasmo:3}},
  {t:'Me mantengo al margen, no es mi guerra', s:{independencia:2}},
  {t:'Se me nota que la tensión me afecta', s:{sensibilidad:3}},
]},
{tag:'Metas', text:'¿Qué harías si tu sueño más grande pareciera imposible?',
 opts:[
  {t:'Trabajar el doble hasta lograrlo', s:{ambicion:4,orgullo:1}},
  {t:'Buscar ayuda de la gente en la que confío', s:{lealtad:2,sociabilidad:1}},
  {t:'Seguir soñando con ello aunque tarde años', s:{idealismo:3}},
  {t:'Cambiar de sueño si este no funciona', s:{espontaneidad:2,independencia:1}},
]},
{tag:'Metas', text:'¿Cómo defines el éxito para ti?',
 opts:[
  {t:'Llegar más lejos que nadie en lo que me propongo', s:{ambicion:4}},
  {t:'Sentirme en paz con quien soy', s:{idealismo:2,independencia:1,sensibilidad:1}},
  {t:'Tener a mi lado a quien de verdad importa', s:{lealtad:2,sociabilidad:2}},
  {t:'Vivir tantas experiencias distintas como pueda', s:{espontaneidad:3}},
]},
{tag:'Conflicto', text:'Alguien te trata injustamente delante de otras personas.',
 opts:[
  {t:'Se lo digo claro ahí mismo, sin rodeos', s:{orgullo:2,independencia:1,ambicion:1}},
  {t:'Respondo con una ironía que deja claro lo que pienso', s:{sarcasmo:3}},
  {t:'Lo dejo pasar por no montar un problema', s:{sensibilidad:2,idealismo:1}},
  {t:'Se lo cuento después a alguien de confianza, en privado', s:{lealtad:2}},
]},
{tag:'Conflicto', text:'Dos personas cercanas a ti discuten y te piden que tomes partido.',
 opts:[
  {t:'Me pongo del lado de quien creo que tiene razón, aunque duela', s:{idealismo:2,orgullo:1}},
  {t:'Intento mediar para que no se rompa nada', s:{sociabilidad:2,sensibilidad:1}},
  {t:'Me niego a elegir, no es mi papel', s:{independencia:3}},
  {t:'Apoyo a quien más quiero, sin pensarlo', s:{lealtad:3}},
]},
{tag:'Lealtad', text:'Tu mejor amigo/a comete un error grave.',
 opts:[
  {t:'Le apoyo pase lo que pase', s:{lealtad:3,sensibilidad:1}},
  {t:'Le digo la verdad aunque le duela', s:{orgullo:1,ambicion:1,independencia:1}},
  {t:'Intento quitarle hierro con humor', s:{sarcasmo:2}},
  {t:'Confío en que aprenderá solo/a', s:{independencia:2,idealismo:1}},
]},
{tag:'Lealtad', text:'Descubres que alguien habló mal de ti a tus espaldas.',
 opts:[
  {t:'Se lo digo directamente, cara a cara', s:{orgullo:2,independencia:1}},
  {t:'Me duele más de lo que esperaba', s:{sensibilidad:3}},
  {t:'Sigo tratándole igual, no merece más energía', s:{idealismo:2,independencia:1}},
  {t:'Se lo cuento a mi gente de confianza para desahogarme', s:{lealtad:2,sociabilidad:1}},
]},
{tag:'Miedos', text:'¿Qué es lo que más te cuesta admitir en voz alta?',
 opts:[
  {t:'Que necesito ayuda de otros', s:{orgullo:3,independencia:1}},
  {t:'Que algo me ha hecho daño de verdad', s:{sensibilidad:3}},
  {t:'Que me equivoqué en algo importante', s:{orgullo:2,ambicion:1}},
  {t:'Nada, lo digo todo tal cual', s:{espontaneidad:2,sociabilidad:1}},
]},
{tag:'Miedos', text:'¿Qué es lo que más temes perder?',
 opts:[
  {t:'El control sobre mi propia vida', s:{independencia:2,orgullo:2}},
  {t:'A las personas que quiero', s:{lealtad:3}},
  {t:'Mi reputación o el respeto de los demás', s:{orgullo:3,ambicion:1}},
  {t:'Las ganas de soñar', s:{idealismo:3}},
]},
{tag:'Instinto', text:'Si fueras un elemento de la naturaleza, ¿cuál serías?',
 opts:[
  {t:'Fuego: intenso, imparable', s:{ambicion:2,espontaneidad:2}},
  {t:'Agua: adaptable, profunda', s:{sensibilidad:2,idealismo:1}},
  {t:'Viento: libre, imprevisible', s:{espontaneidad:3,independencia:1}},
  {t:'Tierra: estable, siempre ahí', s:{lealtad:3}},
]},
{tag:'Instinto', text:'Descubres un secreto que podría cambiarlo todo para varias personas.',
 opts:[
  {t:'Lo uso a mi favor si me conviene', s:{ambicion:2,sarcasmo:1,orgullo:1}},
  {t:'Se lo cuento solo a quien más confío', s:{lealtad:2,sensibilidad:1}},
  {t:'Actúo según lo que creo correcto, cueste lo que cueste', s:{idealismo:3,orgullo:1}},
  {t:'Lo guardo, no es asunto mío', s:{independencia:2}},
]},
{tag:'Trabajo', text:'¿Cómo prefieres trabajar en equipo?',
 opts:[
  {t:'Liderando, con un objetivo claro', s:{ambicion:3,orgullo:1}},
  {t:'Con buen ambiente, entre risas', s:{sociabilidad:2,sarcasmo:1}},
  {t:'Con una o dos personas de total confianza', s:{lealtad:3}},
  {t:'Solo/a, a mi ritmo', s:{independencia:3}},
]},
{tag:'Trabajo', text:'Te ofrecen un ascenso que implica dejar atrás a tu equipo actual.',
 opts:[
  {t:'Lo acepto, mis metas van primero', s:{ambicion:3,orgullo:1}},
  {t:'Lo rechazo, no abandono a los míos', s:{lealtad:3}},
  {t:'Negocio una forma de quedarme cerca de ambas cosas', s:{idealismo:1,sociabilidad:2}},
  {t:'Decido siguiendo mi instinto del momento', s:{espontaneidad:2,independencia:1}},
]},
{tag:'Humor', text:'¿Qué tipo de humor te define mejor?',
 opts:[

  const c = document.getElementById('prog-dots');
  c.innerHTML = '';
  for (let i=0;i<Qs.length;i++) {
    const d = document.createElement('span');
    d.className='prog-star'; d.id=`dot-${i}`; d.textContent='⭐';
    c.appendChild(d);
  }
}
function updateDots() {
  for (let i=0;i<Qs.length;i++) {
    const d = document.getElementById(`dot-${i}`);
    if (!d) continue;
    d.className = 'prog-star' + (answers[i]!==null?' done':(i===current?' cur':''));
  }
}

function renderQ() {
  const q = Qs[current];
  document.getElementById('q-tag').textContent = q.tag;
  document.getElementById('q-text').textContent = q.text;

  const container = document.getElementById('opts');
  container.innerHTML = '';
  const letters = ['A','B','C','D'];
  const sel = answers[current];

  q.opts.forEach((opt,i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    if (sel===i) btn.classList.add('sp');
    btn.innerHTML=`<span class="opt-letter">${letters[i]}</span>${opt.t}`;
    btn.addEventListener('click',()=>selectOpt(i));
    container.appendChild(btn);
  });

  const pct = (current/Qs.length)*100;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = `Pregunta ${current+1} de ${Qs.length}`;
  const done = answers.filter(a=>a!==null).length;
  document.getElementById('prog-frac').textContent = `${done} / ${Qs.length}`;
  updateDots();
  updateNav();

  const card = document.getElementById('q-card');
  card.style.animation='none'; void card.offsetWidth;
  card.style.animation='popIn .35s cubic-bezier(.34,1.4,.64,1) both';
}

function applyScore(optIdx, sign) {
  const s = Qs[current].opts[optIdx].s;
  DIMS.forEach(d => { if(s[d]) scores[d]=(scores[d]||0)+sign*s[d]; });
}

function selectOpt(idx) {
  if (answers[current]!==null) applyScore(answers[current],-1);
  applyScore(idx,+1);
  answers[current]=idx;

  const btns = document.querySelectorAll('.opt');
  btns.forEach((btn,i)=>{
    btn.classList.remove('sp');
    if (answers[current]===i) btn.classList.add('sp');
  });
  updateNav();
  setTimeout(()=>goNext(),380);
}

function hasAnswer() {
  const s = answers[current];
  return s!==null && (!Array.isArray(s)||s.length>0);
}
function updateNav() {
  document.getElementById('btn-prev').disabled = current===0;
  const nb = document.getElementById('btn-next');
  nb.disabled = !hasAnswer();
  nb.textContent = current===Qs.length-1 ? 'Ver mi resultado ✨' : 'Siguiente →';
}
function goNext() {
  if (!hasAnswer()) return;
  if (current<Qs.length-1) { current++; renderQ(); }
  else triggerResult();
}
function goBack() {
  if (current>0) { current--; renderQ(); }
}

// ══════════════════════════════════════════════════════
// SCORING V8 — distancia euclídea ponderada + corrección de
// sesgo de centroide. Motor heredado del test de razas de perro,
// recalibrado para estas 40 preguntas y estos 40 personajes con
// una simulación de 20.000 usuarios respondiendo al azar.
//
// A diferencia del test de perros (20 razas, ratio de victorias
// 7.2x), con el doble de personajes en el mismo espacio de 9
// dimensiones el reparto es necesariamente más apretado: algunos
// personajes con perfiles "moderados" (Moana, Mickey, Anna...)
// ganan como resultado nº1 con menor frecuencia bajo respuestas
// aleatorias puras que personajes con perfiles más extremos
// (Stitch, Genio, Woody). Esto es constatado y esperado: en la
// práctica, las respuestas reales de una persona están correla-
// cionadas entre sí (no son aleatorias independientes como en la
// simulación de calibración), así que la distribución real es
// bastante más suave que este "peor caso" de prueba. Además, el
// podio (top 3) siempre se muestra, así que ningún personaje
// queda invisible para el usuario aunque rara vez sea el nº1.
//
// Validación (20.000 usuarios simulados, respuestas aleatorias):
// - 40/40 personajes alcanzables como resultado nº1
// - Ratio de victorias máx/mín: ~30x (vs 7.2x en el test de 20
//   razas; esperable al doblar el roster en el mismo espacio)
// - Techo y suelo de score calibrados con percentil 99 y percentil
//   1 del score del líder sobre las 20.000 simulaciones
//
// Si se cambian preguntas o perfiles en el futuro, re-ejecutar el
// harness de calibración para actualizar POP_STATS y SCORE_FLOOR/CEIL.
// ══════════════════════════════════════════════════════

const POP_STATS = {
  ambicion:      { mean: 18.5, std: 6.0 },
  sociabilidad:  { mean: 9.5,  std: 3.6 },
  lealtad:       { mean: 17.5, std: 5.7 },
  independencia: { mean: 16.2, std: 4.9 },
  idealismo:     { mean: 12.0, std: 4.3 },
  espontaneidad: { mean: 15.8, std: 5.4 },
  sarcasmo:      { mean: 11.3, std: 4.3 },
  orgullo:       { mean: 15.4, std: 4.5 },
  sensibilidad:  { mean: 14.2, std: 5.0 },
};

const DIM_WEIGHTS = (function() {
  const weights = {};
  DIMS.forEach(d => {
    const vals = breeds.map(b => b.profile[d]);
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const variance = vals.reduce((a,b)=>a+Math.pow(b-mean,2),0)/vals.length;
    weights[d] = variance;
  });
  const totalW = Object.values(weights).reduce((a,b)=>a+b,0);
  const scale = DIMS.length / totalW;
  DIMS.forEach(d => weights[d] *= scale);
  return weights;
})();

const CENTROID_BIAS = (function() {
  const centroid = {};
  DIMS.forEach(d => centroid[d] = 50);
  const distances = breeds.map(breed => {
    let sq = 0;
    DIMS.forEach(d => { const diff = breed.profile[d]-centroid[d]; sq += DIM_WEIGHTS[d]*diff*diff; });
    return Math.sqrt(sq/DIMS.length);
  });
  const meanDist = distances.reduce((a,b)=>a+b,0)/distances.length;
  const bias = {};
  breeds.forEach((breed,i) => {
    bias[breed.name] = (distances[i] - meanDist) * 0.5;
  });
  return bias;
})();

const SCORE_CEIL = 91.7;
const SCORE_FLOOR = 79.8;

function computeRanking() {
  const userNorm = {};
  DIMS.forEach(d => {
    const { mean, std } = POP_STATS[d];
    const z = ((scores[d] || 0) - mean) / std;
    userNorm[d] = Math.max(0, Math.min(100, 50 + z * 18));
  });

  const ranked = breeds.map(breed => {
    let sumSqDiff = 0;
    DIMS.forEach(d => {
      const diff = breed.profile[d] - userNorm[d];
      sumSqDiff += DIM_WEIGHTS[d] * diff * diff;
    });
    const distance = Math.sqrt(sumSqDiff / DIMS.length);
    const rawScore = 100 - distance * 0.72;
    const score = rawScore + CENTROID_BIAS[breed.name];
    return { breed, score };
  });

  ranked.sort((a,b) => b.score - a.score);

  const leaderScore = ranked[0].score;
  const leaderQuality = Math.max(0, Math.min(1, (leaderScore - SCORE_FLOOR) / (SCORE_CEIL - SCORE_FLOOR)));
  const topPct = 62 + Math.pow(leaderQuality, 0.6) * 36;

  const GAP_STRETCH = 5.5;

  return ranked.map(item => {
    const gap = leaderScore - item.score;
    const pct = Math.round(Math.max(8, Math.min(99, topPct - gap * GAP_STRETCH)));
    return { breed: item.breed, pct, score: item.score };
  });
}

function triggerResult() {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const ld = document.getElementById('screen-loading');
  ld.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});

  const breedNames = breeds.map(b=>b.name);
  let i=0;
  const el = document.getElementById('loading-breeds');
  const iv = setInterval(()=>{
    el.textContent = `Comparando con ${breedNames[i%breedNames.length]}…`;
    i++;
  },110);

  setTimeout(()=>{
    clearInterval(iv);
    ld.style.display='none';
    buildResult();
    show('screen-result');
  }, 3000);
}

// ══════════════════════════════════════════════════════
// BUILD RESULT
// ══════════════════════════════════════════════════════
function buildResult() {
  const ranking = computeRanking();
  const top3 = ranking.slice(0,3);
  const best = top3[0];
  const gap = top3[0].pct - top3[1].pct;
  currentResult = { breed: best.breed, pct: best.pct };

  let marginNote, marginClass;
  if (gap >= 8) {
    marginNote = `Resultado claro: ${gap} puntos de ventaja sobre el segundo puesto.`;
    marginClass = 'clear';
  } else if (gap >= 4) {
    marginNote = `Resultado bastante definido, con algo de ${top3[1].breed.name} en ti también.`;
    marginClass = '';
  } else {
    marginNote = `Empate técnico con ${top3[1].breed.name} — eres una mezcla de ambos.`;
    marginClass = 'tied';
  }

  const maxScore = Math.max(...DIMS.map(d=>scores[d]||0),1);

  const barsHTML = DIMS.map(d=>{
    const v = scores[d]||0;
    const pBar = Math.round((v/maxScore)*100);
    return `
    <div class="bar-row">
      <div class="bar-lbl">${DIM_META[d].label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:0%;background:${DIM_META[d].color}" data-pct="${pBar}"></div></div>
      <div class="bar-val">${pBar}%</div>
    </div>`;
  }).join('');

  const medals=['🥇','🥈','🥉'];
  const rankClass=['r1','r2','r3'];
  const podiumHTML = top3.map((item,i)=>`
    <div class="pc ${rankClass[i]}">
      <span class="pc-medal">${medals[i]}</span>
      <div class="pc-emoji" ${CHAR_ICONS[item.breed.name]?'style="display:none"':''}>${item.breed.emoji}</div>
      ${CHAR_ICONS[item.breed.name]?`<img class="pc-icon" src="${CHAR_ICONS[item.breed.name]}" alt="${item.breed.name}" onerror="this.style.display='none';this.previousElementSibling.style.display='block'">`:''}
      <div class="pc-name">${item.breed.name}</div>
      <div class="pc-pct">${item.pct}%</div>
      ${i>0?`<div class="pc-gap">−${top3[0].pct-item.pct} pts</div>`:''}
    </div>`).join('');

  const b = best.breed;
  const shareLabel = (typeof navigator !== 'undefined' && navigator.share) ? '📤 Compartir resultado' : '📋 Copiar resultado';
  document.getElementById('result-content').innerHTML = `
    <div class="share-card">
      <span class="result-emoji" ${CHAR_ICONS[b.name]?'style="display:none"':''}>${b.emoji}</span>
      ${CHAR_ICONS[b.name]?`<img class="result-icon" src="${CHAR_ICONS[b.name]}" alt="${b.name}" onerror="this.style.display='none';this.previousElementSibling.style.display='block'">`:''}
      <div class="result-eyebrow">Eres...</div>
      <div class="result-name">${b.name}</div>
      <div class="result-tagline">"${b.tagline}"</div>
      <div class="match-badge">✦ ${best.pct}% de coincidencia</div>
      <div class="margin-note ${marginClass}">${marginNote}</div>
      <div class="traits-row">${b.traits.map(t=>`<span class="trait-pill">${t}</span>`).join('')}</div>
      <button class="btn-copy" data-breed-name="${b.name}" data-breed-pct="${best.pct}" data-breed-emoji="${b.emoji}" data-compat-good="${b.compat.good}" data-compat-clash="${b.compat.clash}" data-default-label="${shareLabel}" onclick="shareResult(this)">${shareLabel}</button>
      <button class="btn-copy btn-download" data-breed-name="${b.name}" onclick="downloadResultImage(this)">🖼️ Descargar imagen</button>
    </div>

    <div class="section">
      <div class="section-head">✨ Lo que te define</div>
      <div class="desc-box">${b.desc}</div>
    </div>

    <div class="section">
      <div class="section-head">🏆 Tu podio de personajes</div>
      <div class="podium">${podiumHTML}</div>
    </div>

    <div class="section">
      <div class="section-head">📊 Tu perfil de personalidad</div>
      <div class="bars-box">${barsHTML}</div>
    </div>

    <div class="section">
      <div class="section-head">💛 Compatibilidades</div>
      <div class="compat-row">
        <div class="cc good">
          <div class="cc-lbl">✓ Conectas con</div>
          <div class="cc-breed">${b.compat.good}</div>
          <div class="cc-why">${b.compat.goodWhy}</div>
        </div>
        <div class="cc clash">
          <div class="cc-lbl">✗ Chocas con</div>
          <div class="cc-breed">${b.compat.clash}</div>
          <div class="cc-why">${b.compat.clashWhy}</div>
        </div>
      </div>
    </div>

    <button class="btn-restart" onclick="restart()">🔄 Volver a empezar</button>
  `;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      document.querySelectorAll('.bar-fill').forEach(b=>{b.style.width=b.dataset.pct+'%'});
    });
  });
}

// ══════════════════════════════════════════════════════
// COMPARTIR / COPIAR RESULTADO
// ══════════════════════════════════════════════════════
function buildShareText(name, pct, emoji, compatGood, compatClash) {
  let text = `${emoji} Acabo de hacer el test "¿Qué personaje Disney eres?" y soy ${name} (${pct}% de coincidencia).\n\n`;
  text += `💛 Conecto genial con: ${compatGood}\n`;
  text += `⚡ Choco con: ${compatClash}\n\n`;
  text += `¿Tú qué saldrías? Hazlo y vemos si somos compatibles o si vamos a chocar 👀✨`;
  if (typeof location !== 'undefined' && location.href && location.protocol !== 'file:') {
    text += `\n${location.href}`;
  }
  return text;
}

function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (err) {
    return false;
  }
}

function showButtonFeedback(btn, msg, revertMs) {
  if (!btn) return;
  const original = btn.dataset.defaultLabel || btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = original; btn.disabled = false; }, revertMs || 2000);
}

async function shareResult(btn) {
  const name = btn.dataset.breedName;
  const pct = btn.dataset.breedPct;
  const emoji = btn.dataset.breedEmoji || '✨';
  const compatGood = btn.dataset.compatGood;
  const compatClash = btn.dataset.compatClash;
  const text = buildShareText(name, pct, emoji, compatGood, compatClash);

  if (navigator.share) {
    try {
      await navigator.share({ text, title: '¿Qué personaje Disney eres?' });
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      showButtonFeedback(btn, '✓ ¡Copiado!');
      return;
    }
    throw new Error('Clipboard API no disponible en este contexto');
  } catch (err) {
    const ok = legacyCopy(text);
    showButtonFeedback(btn, ok ? '✓ ¡Copiado!' : '⚠️ No se pudo copiar, hazlo manualmente');
  }
}

// ══════════════════════════════════════════════════════
// DESCARGAR IMAGEN DE RESULTADO (canvas)
// ══════════════════════════════════════════════════════
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  });
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return lines.length;
}

async function downloadResultImage(btn) {
  if (!currentResult) return;
  const originalLabel = btn.textContent;
  btn.textContent = '⏳ Generando…';
  btn.disabled = true;

  try {
    const { breed, pct } = currentResult;
    const W = 1080, H = 1620;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, '#FFF8EE');
    bgGrad.addColorStop(1, '#FEF0D8');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    const halo = ctx.createRadialGradient(W-120, 120, 0, W-120, 120, 420);
    halo.addColorStop(0, 'rgba(224,122,58,.14)');
    halo.addColorStop(1, 'rgba(224,122,58,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    const cardX = 60, cardY = 90, cardW = W-120, cardH = 990;
    ctx.fillStyle = '#FFFFFF';
    ctx.save();
    roundRect(ctx, cardX, cardY, cardW, cardH, 40);
    ctx.shadowColor = 'rgba(58,46,34,.12)';
    ctx.shadowBlur = 40;
    ctx.shadowOffsetY = 14;
    ctx.fill();
    ctx.restore();
    ctx.save();
    roundRect(ctx, cardX, cardY, cardW, cardH, 40);
    ctx.strokeStyle = '#F7E2BB';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    let cy = cardY + 90;

    ctx.fillStyle = '#9C8870';
    ctx.font = '700 30px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ERES...', W/2, cy);
    cy += 70;

    const iconMaxSize = 340;
    const iconY = cy;
    await new Promise((resolve) => {
      const iconSrc = CHAR_ICONS[breed.name];
      if (iconSrc) {
        const img = new Image();
        img.onload = () => {
          const ratio = img.naturalWidth / img.naturalHeight;
          let drawW = iconMaxSize, drawH = iconMaxSize;
          if (ratio >= 1) { drawH = iconMaxSize / ratio; }
          else { drawW = iconMaxSize * ratio; }
          const drawX = W/2 - drawW/2;
          const drawY = iconY + (iconMaxSize - drawH)/2;
          ctx.drawImage(img, drawX, drawY, drawW, drawH);
          resolve();
        };
        img.onerror = () => {
          ctx.font = `${iconMaxSize*0.7}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(breed.emoji || '✨', W/2, iconY + iconMaxSize*0.75);
          resolve();
        };
        img.src = iconSrc;
      } else {
        ctx.font = `${iconMaxSize*0.7}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(breed.emoji || '✨', W/2, iconY + iconMaxSize*0.75);
        resolve();
      }
    });
    cy = iconY + iconMaxSize + 70;

    ctx.fillStyle = '#3A2E22';
    ctx.font = '800 64px Lora, serif';
    ctx.textAlign = 'center';
    ctx.fillText(breed.name, W/2, cy);
    cy += 56;

    ctx.fillStyle = '#9C8870';
    ctx.font = 'italic 600 32px Nunito, sans-serif';
    const taglineLines = wrapCanvasText(ctx, `"${breed.tagline}"`, W/2, cy, cardW-140, 42);
    cy += taglineLines * 42 + 40;

    const starPart = '✦';
    const textPart = ` ${pct}% de coincidencia`;
    ctx.font = '800 34px Nunito, sans-serif';
    const starW = ctx.measureText(starPart).width;
    const textW = ctx.measureText(textPart).width;
    const contentW = starW + textW;
    const badgeW = contentW + 80;
    const badgeH = 70;
    const badgeTop = cy - badgeH + 14;
    const badgeCenterY = badgeTop + badgeH / 2;
    ctx.save();
    roundRect(ctx, W/2 - badgeW/2, badgeTop, badgeW, badgeH, 35);
    ctx.fillStyle = '#E07A3A';
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#FFFFFF';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const contentStartX = W/2 - contentW/2;
    ctx.fillText(starPart, contentStartX, badgeCenterY);
    ctx.fillText(textPart, contentStartX + starW, badgeCenterY);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    cy += 90;

    if (breed.traits && breed.traits.length) {
      ctx.font = '700 26px Nunito, sans-serif';
      const gap = 16;
      const paddingX = 26, chipH = 56;
      const widths = breed.traits.map(t => ctx.measureText(t).width + paddingX*2);
      const totalW = widths.reduce((a,b)=>a+b,0) + gap*(widths.length-1);
      let chipX = W/2 - totalW/2;
      breed.traits.forEach((t, i) => {
        const w = widths[i];
        ctx.save();
        roundRect(ctx, chipX, cy, w, chipH, chipH/2);
        ctx.fillStyle = '#FDF0DC';
        ctx.fill();
        ctx.strokeStyle = '#ECD9BE';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#3A2E22';
        ctx.textAlign = 'center';
        ctx.fillText(t, chipX + w/2, cy + chipH/2 + 9);
        chipX += w + gap;
      });
    }

    let compatY = cardY + cardH + 60;
    const compatCardW = cardW;
    const compatCardH = 380;
    const halfW = (compatCardW - 24) / 2;

    function compatBlock(x, label, breedName, why, good) {
      ctx.save();
      roundRect(ctx, x, compatY, halfW, compatCardH, 30);
      ctx.fillStyle = good ? '#F1F7EE' : '#FBEFEF';
      ctx.fill();
      ctx.strokeStyle = good ? '#CFE3C6' : '#EFCFCF';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();

      let bx = x + halfW/2;
      let by = compatY + 60;

      ctx.font = '56px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(good ? '👍' : '👎', bx, by + 10);
      by += 70;

      ctx.font = '800 24px Nunito, sans-serif';
      ctx.fillStyle = good ? '#5C8A4A' : '#B5504F';
      ctx.fillText(label, bx, by);
      by += 48;

      ctx.font = '800 34px Lora, serif';
      ctx.fillStyle = '#3A2E22';
      ctx.fillText(breedName, bx, by);
      by += 46;

      ctx.font = '600 22px Nunito, sans-serif';
      ctx.fillStyle = '#7A6B58';
      wrapCanvasText(ctx, why, bx, by, halfW - 60, 30);
    }

    compatBlock(cardX, 'CONECTAS CON', breed.compat.good, breed.compat.goodWhy, true);
    compatBlock(cardX + halfW + 24, 'CHOCAS CON', breed.compat.clash, breed.compat.clashWhy, false);

    ctx.fillStyle = '#9C8870';
    ctx.font = '700 28px Nunito, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('¿Qué personaje Disney eres? ✨', W/2, H - 50);

    const link = document.createElement('a');
    const safeName = breed.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    link.download = `que-personaje-disney-eres-${safeName}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();

    btn.textContent = '✓ ¡Descargada!';
    setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 1800);
  } catch (err) {
    console.error('Error generando imagen de resultado:', err);
    btn.textContent = '⚠️ No se pudo generar';
    setTimeout(() => { btn.textContent = originalLabel; btn.disabled = false; }, 2200);
  }
}

// START / RESTART
// ══════════════════════════════════════════════════════
function startQuiz(){
  current=0;
  answers=new Array(Qs.length).fill(null);
  DIMS.forEach(d=>scores[d]=0);
  initDots();
  show('screen-quiz');
  renderQ();
}
function restart(){
  startQuiz();
}
</script>
